# The Python host (python/, PySide6): run the cross-host conformance walk.
# No packaging: the C++ host (ci.yml) is the one that ships.
name: Python host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (PySide6)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install PySide6
        run: python -m pip install -r python/requirements.txt

      - name: Conformance walk
        run: python tools/verify.py --cmd "python python/main.py"

      - name: Screenshot
        run: |
          python python/main.py --time 1987-06-01T10:08:30 \
              --script "battery.inserted;a;a;a;a;b" --grab python-host.png
          test -s python-host.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-host-screenshot
          path: python-host.png
          if-no-files-found: ignore
