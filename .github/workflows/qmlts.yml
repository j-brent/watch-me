# The TypeScript/QML host (qmlts/): type-check, build the ES modules with tsc,
# and run the cross-host conformance walk (docs/HOST-CONTRACT.md §6) against it.
name: qmlts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qmlts-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.8.3"
  QT_QPA_PLATFORM: offscreen

jobs:
  qmlts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qmlts/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtscxml
          cache: true

      - name: Install TypeScript
        working-directory: qmlts
        run: npm ci

      - name: Type check
        working-directory: qmlts
        run: npx tsc --noEmit -p .

      - name: Build the ES modules
        working-directory: qmlts
        run: npm run build

      - name: Conformance walk
        # install-qt-action puts Qt's bin/ (with the qml tool) on PATH
        run: python tools/verify.py --cmd "qmlts/watch-me-qmlts"

      - name: Screenshot
        run: |
          qmlts/watch-me-qmlts --time 1987-06-01T10:08:30 \
              --script "battery.inserted;a;a;a;a;b" --grab qmlts-screenshot.png
          test -s qmlts-screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qmlts-screenshot
          path: qmlts-screenshot.png
          if-no-files-found: ignore
