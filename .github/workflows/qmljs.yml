# The QML/JavaScript host (qmljs/): nothing to build. Install Qt and run the
# conformance walk (docs/HOST-CONTRACT.md §6) against Qt's `qml` tool.
name: qmljs host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qmljs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.8.3"
  QT_QPA_PLATFORM: offscreen

jobs:
  verify:
    name: Ubuntu (qml tool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libpulse0 \
            xvfb xauth

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtscxml
          cache: true

      # The launcher finds `qml` through QT_ROOT_DIR, which install-qt-action sets.
      - name: Conformance walk
        run: python tools/verify.py --cmd "qmljs/watch-me-qmljs"

      - name: Screenshot
        run: |
          qmljs/watch-me-qmljs --time 1987-06-01T10:08:30 --script "battery.inserted;a;a;a;a;b" --grab qmljs.png
          test -s qmljs.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qmljs-screenshot
          path: qmljs.png
          if-no-files-found: ignore
