# Release: push a tag like v1.0.0. The CI workflow is reused to build, test and
# package on Ubuntu, Windows and macOS; only if all three pass are the packages
# published as a GitHub release for that tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac   # v1.0.0-rc1 etc.
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "watch-me $TAG" \
            --generate-notes \
            --verify-tag $prerelease
