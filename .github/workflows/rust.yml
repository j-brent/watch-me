# Build the Rust host (rust/) and run the cross-host conformance walk on it.
# No packaging: the released packages are the C++ host's (ci.yml).
name: Rust host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.8.3"
  QT_QPA_PLATFORM: offscreen
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Ubuntu (Rust host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtscxml
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        # cxx-qt-build finds Qt through qmake
        run: |
          echo "QMAKE=$QT_ROOT_DIR/bin/qmake6" >> "$GITHUB_ENV"
          QMAKE="$QT_ROOT_DIR/bin/qmake6" cargo build --release --manifest-path rust/Cargo.toml

      - name: Unit tests
        run: cargo test --release --manifest-path rust/Cargo.toml

      - name: Conformance walk (docs/HOST-CONTRACT.md §6)
        run: python3 tools/verify.py --cmd "rust/target/release/watch-me-rs"

      - name: Smoke test the window
        # Loads shared/qml/Main.qml with the Rust objects and saves a screenshot.
        run: |
          rust/target/release/watch-me-rs --time 1987-06-01T10:08:30 \
              --script "battery.inserted;a;a;a;a;b" --grab rust-smoke.png
          test -s rust-smoke.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-smoke-screenshot
          path: rust-smoke.png
          if-no-files-found: ignore
