[package]
name = "watch-me-rs"
version = "1.0.0"
edition = "2021"
description = "Rust host of watch-me (docs/HOST-CONTRACT.md): Harel's 1987 watch statechart on Qt SCXML + Qt Quick"
publish = false

[[bin]]
name = "watch-me-rs"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
roxmltree = "0.20"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
strip = true
